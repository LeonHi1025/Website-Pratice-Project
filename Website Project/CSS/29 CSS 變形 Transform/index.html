<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            transform: translate(50px, 50px);
            transform: rotate(45deg);
            transform: scale(0.5);
            /* 以上他可以寫在同個transform屬性內 */
            width: 100px;
            height: 100px;
            background-color: orange;
            border: 5px solid;
            font-size: 2em;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="box1">Hi</div>
</body>

</html>
