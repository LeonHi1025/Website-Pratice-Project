<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #content_header { /*只更改目標的顏色(ID)*/
            color:orange
        }

        /* h2 {
            color: orange;
        } */

        .highlight { /*只更改目標的顏色(Class)*/
            color: red;
        }
    </style>
</head>
<body>
    <header>
        <h2>標題</h2>
    </header>
    <h2 id="content_header">內容標題</h2>
    <p>
        我是段落。<span class="highlight">我是需要強調的文字</span>
    </p>

    <p>
        我是另一段落。<span class="highlight">我是需要強調的文字</span>
    </p>
</body>
</html>
