<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        article p:first-child {
            color: green;
        }

        article p:last-child {
            color: blue;
        }
    </style>
</head>

<body>
    <article>
        <p>這是第一段文字</p>
        <p>這是第二段文字</p>
        <p>這是第三段文字</p>
        <p>這是最後一段文字。想閱讀更多？<a href="#">點擊這裡</a></p>
    </article>
</body>

</html>
