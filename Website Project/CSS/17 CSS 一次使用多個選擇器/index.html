<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p, li, a{
            color: orange;
            font-size: 20px;
        }

        /* li {
            color: orange;
            font-size: 20px;
        }

        a {
            color: orange;
            font-size: 20px;
        } */
    </style>
</head>
<body>
    <p>嘿! 我是一大膽的、紅色的段落，我喜歡與大家分享快樂的故事</p>
    <!-- <span> 是一個非常常用且重要的 行內容器（Inline Container）。 -->
    <span>我是一個亮麗的紅色文本，像一朵盛開的玫瑰花</span> 
    <a href="#">我是一大膽的紅色連結，點擊我你會發現新世界</a>
    <!-- <ul> 代表的是 無序列表 (Unordered List)。 -->
    <ul>
        <li>我是列表中的第一個項目，我像一根紅色的棒棒糖，甜而不膩</li>
        <li>我是列表中的第二個項目，我像一杯熱紅酒，溫暖而迷人</li>
    </ul>    
</body>
</html>
